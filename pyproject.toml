[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-budget-lab"
version = "0.1.0"
description = "Analytical KV memory budgeting and bounded CPU–GPU page residency experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ali Haider"}]
dependencies = []

[project.scripts]
kv-cache-lab = "kv_cache_lab.cli:main"

[tool.setuptools.packages.find]
include = ["kv_cache_lab*"]
